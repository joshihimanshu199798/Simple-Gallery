name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK and accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" || true
            set +e
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1
            "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
              "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
            set -e
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and environment config
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -di debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=896m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Verify APK signature and prepare installable file
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          cp "$APK_PATH" SimpleGallery-debug.apk
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs SimpleGallery-debug.apk
          fi
          ls -lh SimpleGallery-debug.apk

      - name: Publish direct APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NOTES="Direct installable Android APK (no zip extraction needed). Tap **SimpleGallery-debug.apk** under Assets to download and open directly on Android. Built from commit \`${SHORT_SHA}\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SimpleGallery-debug.apk --clobber
            gh release edit "$TAG" --title "Simple Gallery Latest APK" --notes "$NOTES"
          else
            gh release create "$TAG" SimpleGallery-debug.apk --title "Simple Gallery Latest APK" --notes "$NOTES"
          fi

      - name: Add direct APK download link to workflow summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Download Installable APK"
            echo ""
            echo "GitHub Actions artifacts are packaged inside a \`.zip\` file and cannot be opened directly in the GitHub Android app."
            echo ""
            echo "Use the direct Release APK below instead (opens Android Package Installer directly):"
            echo "- [Download SimpleGallery-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest-apk/SimpleGallery-debug.apk)"
            echo "- [Open Release Page in GitHub](https://github.com/${{ github.repository }}/releases/tag/latest-apk)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleGallery-debug-apk
          path: SimpleGallery-debug.apk
          compression-level: 0
          if-no-files-found: error
